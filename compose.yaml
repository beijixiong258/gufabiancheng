name: jiluzhushou_shujuku

services:
  mysql:
    image: mysql:8.0
    container_name: jiluzhushou_shujuku
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "030206"
      MYSQL_DATABASE: "jiluzhushou"
      TZ: "Asia/Shanghai"

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7.4
    container_name: jiluzhushou_huancun
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis-data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

volumes:
  mysql-data:
  redis-data:
